<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="sidebarTitle">Notes</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!-- Unique sources section: single line per source with truncated href and distinct background -->
  <section class="sources-section" id="sourcesSection" data-i18n-aria-label="sourcesAriaLabel" aria-label="Unique sources">
    <div class="sources-list" id="sourcesList"></div>
  </section>

  <main class="editor-container">
    <div
      id="noteEditor"
      class="note-editor"
      contenteditable="true"
      data-i18n-placeholder="editorPlaceholder"
      data-placeholder="Blank sheet for your notes..."
      spellcheck="false"
    ></div>
    <div class="toast" id="toastMsg">Added!</div>
  </main>

  <!-- Minimal popup to insert/edit a note (triggered by double-click on a block) -->
  <div class="modal-backdrop" id="noteModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header" data-i18n="noteModalTitle">Note</div>
      <div class="modal-body">
        <input
          type="text"
          id="noteModalInput"
          class="modal-input"
          autocomplete="off"
        />
        <div class="modal-actions">
          <button class="modal-btn" id="noteModalCancelBtn" type="button" data-i18n="btnCancel">Cancel</button>
          <button class="modal-btn modal-btn-primary" id="noteModalOkBtn" type="button" data-i18n="btnOk">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings panel toggled from the ⚙ button in the footer -->
  <section class="settings-bar" id="settingsBar">
    <div class="setting-row">
      <span data-i18n="settingShortcutLabel">Send selection shortcut:</span>
      <button class="shortcut-btn" id="shortcutBtn" data-i18n-title="settingShortcutTitle" title="Click to set a custom shortcut">Alt+A</button>
    </div>
    <label class="setting-label">
      <input type="checkbox" id="chkHtmlToMd" checked />
      <span data-i18n="settingHtmlToMd">Convert HTML to Markdown (links, headings, lists, bold)</span>
    </label>
    <label class="setting-label">
      <input type="checkbox" id="chkAskBlockNote" />
      <span data-i18n="settingAskBlockNote">Show note popup when copying from page (optional)</span>
    </label>
  </section>

  <footer class="footer">
    <div class="footer-left">
      <span id="charCount">0 chars</span>
      <span>·</span>
      <span id="shortcutHint">Shortcut: Alt+A</span>
    </div>
    <div class="footer-actions">
      <button class="icon-btn" id="copyBtn" data-i18n="btnCopy">Copy</button>
      <button class="icon-btn" id="downloadBtn" data-i18n="btnExportMd" data-i18n-title="btnExportMdTitle" title="Save Markdown file choosing destination folder">Export .md</button>
      <button class="icon-btn" id="clearBtn" data-i18n="btnClear">Clear</button>
      <button class="icon-btn" id="settingsBtn" data-i18n-title="btnSettingsTitle" title="Settings">⚙</button>
    </div>
  </footer>

  <script src="sidebar.js"></script>
</body>
</html>
